<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Weather</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">
                <span>Погода</span>
            </h1>
            <div class="header-controls">
                <button id="refresh-btn" class="btn refresh-btn" aria-label="Обновить данные">
                    <span>Обновить</span>
                </button>
                <button id="add-city-btn" class="btn add-city-btn" aria-label="Добавить город">
                    <span>Добавить город</span>
                </button>
                <button id="change-location-btn" class="btn location-btn">
                    <span>Сменить город</span>
                </button>
            </div>
        </header>

        <main class="main-content">
            <div id="weather-container" class="weather-container">
            </div>
            <div id="loading-state" class="loading-state hidden">
                <div class="loading-spinner"></div>
                <p>Загрузка данных о погоде...</p>
            </div>

            <div id="error-state" class="error-state hidden">
                <p id="error-message"></p>
                <button id="retry-btn" class="btn">Попробовать снова</button>
            </div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/api_data.js"></script>
</body>
</html>
