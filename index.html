<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Weather</title>
</head>

<body>
    <section class="container">
        <header class="header">
            <h1 class="title">
                <span>WeatherForecast</span>
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#FFBF00">
                    <path
                        d="M440-760v-160h80v160h-80Zm266 110-55-55 112-115 56 57-113 113Zm54 210v-80h160v80H760ZM440-40v-160h80v160h-80ZM254-652 140-763l57-56 113 113-56 54Zm508 512L651-255l54-54 114 110-57 59ZM40-440v-80h160v80H40Zm157 300-56-57 112-112 29 27 29 28-114 114Zm283-100q-100 0-170-70t-70-170q0-100 70-170t170-70q100 0 170 70t70 170q0 100-70 170t-170 70Zm0-80q66 0 113-47t47-113q0-66-47-113t-113-47q-66 0-113 47t-47 113q0 66 47 113t113 47Zm0-160Z" />
                </svg>
            </h1>
            <div class="header-controls">
                <button id="refresh-btn" class="btn refresh-btn" aria-label="Обновить данные">
                    <span>Обновить</span>
                </button>
                <button id="add-city-btn" class="btn add-city-btn" aria-label="Добавить город">
                    <span>Добавить город</span>
                </button>
                <button id="change-location-btn" class="btn location-btn">
                    <span>Сменить город</span>
                </button>
            </div>
        </header>

        <main class="main-content">
            <div id="weather-container" class="weather-container">
            </div>
            <div id="loading-state" class="loading-state hidden">
                <div class="loading-spinner"></div>
                <p>Загрузка данных</p>
            </div>

            <div id="error-state" class="error-state hidden">
                <p id="error-message"></p>
                <button id="retry-btn" class="btn">Попробовать снова</button>
            </div>
        </main>
    </section>

    <script type="module" src="js/main.js"></script>
</body>

</html>
